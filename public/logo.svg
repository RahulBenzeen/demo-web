<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" fill="none">
  <defs>
    <!-- Gradient for text -->
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Icon: Rounded square with a clear "B" letterform -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#3B82F6"/>
    <text x="14" y="44" font-family="'Poppins', sans-serif" font-size="36" font-weight="700" fill="white">B</text>
  </g>

  <!-- Brand Name -->
  <text x="100" y="58" font-family="'Poppins', sans-serif" font-size="36" font-weight="700" fill="url(#gradText)" letter-spacing="1.2">
    B'LOG
  </text>

  <!-- Tagline
  <text x="100" y="78" font-family="'Poppins', sans-serif" font-size="14" font-weight="400" fill="#6B7280">
    Share Your Spark
  </text> -->
</svg>